name: Backend checks
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "analyst/**"
      - "retrieval/**"
      - "infra/api.Dockerfile"
      - "requirements-api*.txt"
      - "tests/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RETRIEVAL_METHOD: bm25
      ECHOLENS_LOW_MEMORY: "true"
      DUCKDB_MEMORY_LIMIT: 96MB
      DUCKDB_THREADS: "1"
      ALLOWED_ORIGINS: https://simran-kalkeri.github.io
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api-base.txt
      - name: Install backend test dependencies
        run: pip install -r requirements-api-base.txt pytest
      - name: Test real data and analyst guardrails
        run: python -m pytest -q tests
      - name: Build free-plan image
        run: docker build --build-arg API_REQUIREMENTS=requirements-api-base.txt --build-arg PRELOAD_MODELS=false -f infra/api.Dockerfile -t echolens-api .
      - name: Verify API under a 512 MB memory cap
        shell: bash
        run: |
          docker run --detach --name echolens-api --memory=512m --cpus=1 -p 8000:8000 \
            -e RETRIEVAL_METHOD=bm25 -e ECHOLENS_LOW_MEMORY=true \
            -e DUCKDB_MEMORY_LIMIT=96MB -e DUCKDB_THREADS=1 echolens-api
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/api/ready > /tmp/echolens-ready.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/api/workspaces
          curl --fail --silent 'http://localhost:8000/api/overview?ws=spotify' > /dev/null
          curl --fail --silent 'http://localhost:8000/api/feedback?ws=spotify&q=shuffle&sentiment=negative&page_size=5' > /dev/null
          docker stats --no-stream echolens-api
          test "$(docker inspect --format='{{.State.Running}}' echolens-api)" = true
      - name: Show container diagnostics after failures
        if: failure()
        run: docker logs echolens-api || true
